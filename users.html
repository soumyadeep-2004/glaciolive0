<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Dashboard - GlacioLive</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"> 
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="dashboard.css" />
  
  <style>
    /* Styles for Welcome message */
    .welcome-user {
      color: #fff;
      font-weight: 400;
      margin-right: 15px;
      font-size: 20px;
      display: inline-flex;
      align-items: center;
      height: 100%;
      padding-top: 5px;
      padding-left: 10px;
      padding-right: 10px;
    }
    body.light .welcome-user {
        color: #0a1a2e;
    }
    
    #user-status-container {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
    }
    
    @media (max-width: 960px) {
      #user-status-container {
        flex-direction: column;
        align-items: center;
        margin: 20px 0;
      }
      .welcome-user {
        margin-right: 0;
        margin-bottom: 15px; 
      }
    }

    /* Stats Grid - 4 Columns for Metrics */
    .stats-minimal {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin-bottom: 25px;
    }

    /* Theme-matching Card Styles for Stats */
    .user-stat-card {
      background: #112240; /* Dark theme card bg */
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #ffffff10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    
    .user-stat-card:hover {
      transform: translateY(-2px);
      border-color: #4fc3f7;
    }

    .user-stat-card label {
      font-size: 0.85rem;
      color: #8892b0;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .user-stat-card span {
      font-size: 2rem;
      font-weight: 600;
      color: #e0e7ef;
    }

    /* Light Mode overrides for Stats */
    body.light .user-stat-card {
      background: #ffffff;
      border-color: #0a1a2e20;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    body.light .user-stat-card label {
      color: #555;
    }
    body.light .user-stat-card span {
      color: #0a1a2e;
    }

    /* Responsive Stats */
    @media (max-width: 1100px) {
        .stats-minimal {
            grid-template-columns: repeat(2, 1fr);
        }
    }
    @media (max-width: 600px) {
        .stats-minimal {
            grid-template-columns: 1fr;
        }
    }

    /* Map & Content Grid */
    .content-grid {
        display: grid;
        grid-template-columns: 2fr 1fr; /* Map takes more space, Calendar/List takes less */
        gap: 20px;
        align-items: start;
    }

    /* Map Styles */
    .india-map-container {
        position: relative;
        background: #0a1a2e;
        border-radius: 8px;
        height: 600px; /* Fixed height to match calendar+list */
        overflow: hidden;
    }
    #user-map {
        width: 100%;
        height: 100%;
    }
    .user-map-marker {
        background: #4fc3f7 !important;
        color: #0a1a2e !important;
        border: 2px solid #e0e7ef !important;
        width: 18px !important;
        height: 18px !important;
        border-radius: 50% !important;
        display: flex !important;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: bold;
        box-shadow: 0 0 5px #4fc3f7;
    }
    .current-user-marker {
        background: #00e676 !important;
        color: #000 !important;
        border: 3px solid #fff !important;
        width: 24px !important;
        height: 24px !important;
        border-radius: 50% !important;
        display: flex !important;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        box-shadow: 0 0 15px #00e676;
        animation: pulse-green 2s infinite;
    }
    @keyframes pulse-green {
        0% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.7); }
        70% { box-shadow: 0 0 0 10px rgba(0, 230, 118, 0); }
        100% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); }
    }

    /* Calendar Styles */
    .calendar-wrapper {
        background: #112240;
        border-radius: 8px;
        padding: 15px;
        border: 1px solid #ffffff10;
        margin-bottom: 20px;
    }
    body.light .calendar-wrapper {
        background: #ffffff;
        border-color: #0a1a2e20;
    }
    .calendar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        color: #e0e7ef;
        font-weight: bold;
    }
    body.light .calendar-header { color: #0a1a2e; }
    .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 5px;
        text-align: center;
    }
    .cal-day-name {
        font-size: 0.8em;
        color: #8892b0;
        margin-bottom: 5px;
    }
    .cal-day {
        padding: 8px;
        border-radius: 50%;
        cursor: pointer;
        transition: 0.2s;
        font-size: 0.9em;
        position: relative;
        color: #e0e7ef;
    }
    body.light .cal-day { color: #0a1a2e; }
    .cal-day:hover {
        background: #ffffff20;
    }
    body.light .cal-day:hover { background: #0a1a2e10; }
    .cal-day.active {
        background: #4fc3f7;
        color: #0a1a2e;
        font-weight: bold;
    }
    .cal-day.has-event::after {
        content: '';
        position: absolute;
        bottom: 3px;
        left: 50%;
        transform: translateX(-50%);
        width: 4px;
        height: 4px;
        background: #00e676;
        border-radius: 50%;
    }
    .cal-day.empty {
        pointer-events: none;
    }

    /* User List Styles */
    .user-table-wrapper {
        max-height: 300px; /* Scrollable area for list */
        overflow-y: auto;
        background: #112240;
        border-radius: 8px;
    }
    body.light .user-table-wrapper { background: #ffffff; }
    .user-table-wrapper table { width: 100%; border-collapse: collapse; }
    .user-table-wrapper th { 
        position: sticky; top: 0; z-index: 5; 
        background: #1e3a5f; color: #fff; 
        padding: 10px; text-align: left; 
    }
    .user-table-wrapper td { 
        padding: 10px; 
        border-bottom: 1px solid #ffffff10; 
        color: #ccd6f6;
    }
    body.light .user-table-wrapper th { background: #e0e7ef; color: #0a1a2e; }
    body.light .user-table-wrapper td { border-bottom: 1px solid #0a1a2e10; color: #0a1a2e; }

    /* Responsive */
    @media (max-width: 960px) {
        .content-grid { grid-template-columns: 1fr; }
        .india-map-container { height: 400px; }
    }
  </style>

</head>

  <section id="user-dashboard" class="page active">
    <div class="container">

      <div class="dash-tabs">
        <button class="dash-tab-btn" onclick="window.location.href='dashboard.html'">GLOF Dashboard</button>
        <button class="dash-tab-btn active">Users Dashboard</button>
      </div>

      <div id="user-dashboard-content" class="dash-content active">

        <h2 style="font-weight: 300; font-size: 2em; margin-bottom: 20px;">Users Dashboard</h2>

        <div class="stats-minimal">
          <div class="user-stat-card">
            <label>Total Registered Users</label>
            <span id="total-users">--</span>
          </div>
          <div class="user-stat-card">
            <label>Joined Today</label>
            <span id="joined-today">--</span>
          </div>
          <div class="user-stat-card">
            <label>Today's Visitors</label>
            <span id="visitors-today">--</span>
          </div>
          <div class="user-stat-card">
            <label>Total Visitors</label>
            <span id="visitors-total">--</span>
          </div>
        </div>

        <div class="content-grid">
            
            <div class="dash-card user-map-card" style="padding: 0; border: none; background: transparent;">
              <h3 style="background: #112240; padding: 15px; margin:0; border-radius: 8px 8px 0 0;">User Connection Map</h3>
              <div class="india-map-container">

              </div>
            </div>

            <div class="sidebar-column">
                
                <div class="calendar-wrapper">
                    <div class="calendar-header">
                        <span id="cal-month-year">November 2025</span>
                        <button onclick="resetCalendarFilter()" style="background:none; border:none; color:#4fc3f7; cursor:pointer; font-size:0.8em;">Show All</button>

                        </div>

                <div class="dash-card table-card" style="height: auto;">
                    <h3 id="list-title">All Registered Users</h3>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script> 
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, doc, setDoc, getDoc, runTransaction } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBt1Ats_Y4epVTioinUuDB_AfQUFanHtU0",
      authDomain: "glaciolive-fe6ea.firebaseapp.com",
      projectId: "glaciolive-fe6ea",
      storageBucket: "glaciolive-fe6ea.firebasestorage.app",
      messagingSenderId: "562979922381",
      appId: "1:562979922381:web:7c6686faa1a7181880e484",
      measurementId: "G-ZJCNG5LTS0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    // --- GLOBALS ---
    let userMapInstance = null;
    let allUsersData = []; 
    let dashboardInitialized = false;
    
    // --- MAP LOGIC ---
    function initializeUserMap(markers) {
        const mapElementId = 'user-map';
        if (userMapInstance) {
             userMapInstance.remove();
             userMapInstance = null;
        }

        userMapInstance = L.map(mapElementId, { zoomControl: false }).setView([22.0, 78.0], 4);

        const isLight = document.body.classList.contains('light');
        const tileUrl = isLight 
            ? 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
            : 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
        
        L.tileLayer(tileUrl, { attribution: 'OpenStreetMap | CARTO' }).addTo(userMapInstance);

        markers.forEach(markerData => {
            const icon = L.divIcon({
                className: `user-map-marker`, 
                html: '👤',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });
            
            L.marker([markerData.lat, markerData.lon], { icon: icon })
              .addTo(userMapInstance)
              .bindPopup(`<b>${markerData.name}</b><br>Joined: ${markerData.dateStr}`);
        });
        
        // Show current user location if allowed (permission based, not auth based)
        if ("geolocation" in navigator) {
             navigator.geolocation.getCurrentPosition(
                 (position) => {
                     const lat = position.coords.latitude;
                     const lon = position.coords.longitude;
                     const icon = L.divIcon({
                        className: `current-user-marker`, 
                        html: '<i class="fa-solid fa-user"></i>',
                        iconSize: [24, 24],
                        iconAnchor: [12, 12]
                    });
                    L.marker([lat, lon], { icon: icon }).addTo(userMapInstance)
                     .bindPopup("<b>You are here!</b>").openPopup();
                 },
                 (error) => { console.log("Location denied."); },
                 { enableHighAccuracy: true, timeout: 5000 }
             );
        }

        setTimeout(() => { if(userMapInstance) userMapInstance.invalidateSize(); }, 100);
    }

    // --- CALENDAR LOGIC ---
    function renderCalendar(selectedDate = null) {
        const today = new Date();
        const year = today.getFullYear();
        const month = today.getMonth(); 
        
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        document.getElementById('cal-month-year').textContent = `${monthNames[month]} ${year}`;

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        const calendarGrid = document.getElementById('calendar-days');
        calendarGrid.innerHTML = '';

        ['S','M','T','W','T','F','S'].forEach(d => {
            const el = document.createElement('div');
            el.className = 'cal-day-name';
            el.textContent = d;
            calendarGrid.appendChild(el);
        });

        for (let i = 0; i < firstDay; i++) {
            const el = document.createElement('div');
            el.className = 'cal-day empty';
            calendarGrid.appendChild(el);
        }

        for (let d = 1; d <= daysInMonth; d++) {
            const el = document.createElement('div');
            el.className = 'cal-day';
            el.textContent = d;
            
            const dateString = `${d}/${month + 1}/${year}`; 
            const hasUser = allUsersData.some(u => {
                const uDate = u.rawDate.getDate();
                const uMonth = u.rawDate.getMonth();
                const uYear = u.rawDate.getFullYear();
                return uDate === d && uMonth === month && uYear === year;
            });
            
            if (hasUser) el.classList.add('has-event');
            
            if (selectedDate && selectedDate.getDate() === d) {
                el.classList.add('active');
            }

            el.onclick = () => filterByDate(d, month, year);
            calendarGrid.appendChild(el);
        }
    }

    // --- FILTER & UI LOGIC ---
    window.resetCalendarFilter = function() {
        renderUserTable(allUsersData);
        renderCalendar(null);
        document.getElementById('list-title').textContent = "All Registered Users";
    }

    function filterByDate(day, month, year) {
        const selectedDate = new Date(year, month, day);
        const filtered = allUsersData.filter(u => {
            const uDate = u.rawDate.getDate();
            const uMonth = u.rawDate.getMonth();
            const uYear = u.rawDate.getFullYear();
            return uDate === day && uMonth === month && uYear === year;
        });
        
        renderUserTable(filtered);
        renderCalendar(selectedDate);
        document.getElementById('list-title').textContent = `Users joined on ${day}/${month+1}/${year}`;
    }

    function renderUserTable(users) {
        const tbody = document.getElementById('user-table-body');
        tbody.innerHTML = '';
        if (users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="2">No users found.</td></tr>';
            return;
        }
        users.forEach(u => {
            const row = document.createElement('tr');
            row.innerHTML = `<td>${u.name}</td><td>${u.dateStr}</td>`;
            tbody.appendChild(row);
        });
    }

    // --- VISITOR STATS LOGIC ---
    async function manageVisitorStats() {
        const statsDocRef = doc(db, 'artifacts', 'glacio_stats', 'public', 'visitors');
        const todayString = new Date().toISOString().split('T')[0]; // YYYY-MM-DD

        // 1. LISTEN: Real-time updates for everyone (Public Read required)
        onSnapshot(statsDocRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                const storedDate = data.currentDate || "";
                
                document.getElementById('visitors-total').textContent = data.totalVisitors || 0;

                if (storedDate === todayString) {
                    document.getElementById('visitors-today').textContent = data.todayVisitors || 0;
                } else {
                    document.getElementById('visitors-today').textContent = 0; 
                }
            } else {
                document.getElementById('visitors-total').textContent = 0;
                document.getElementById('visitors-today').textContent = 0;
            }
        }, (error) => {
             console.warn("Stats read failed. Public access required.", error);
        });

        // 2. INCREMENT: Only once per day per user
        // This will only work if Firestore rules allow public write to this document
        const lastVisit = localStorage.getItem('last_visit_date');
        
        if (lastVisit !== todayString) {
            try {
                await runTransaction(db, async (transaction) => {
                    const sfDoc = await transaction.get(statsDocRef);
                    
                    if (!sfDoc.exists()) {
                        transaction.set(statsDocRef, {
                            totalVisitors: 1,
                            todayVisitors: 1,
                            currentDate: todayString
                        });
                    } else {
                        const data = sfDoc.data();
                        const dbDate = data.currentDate;
                        
                        let newTotal = (data.totalVisitors || 0) + 1;
                        let newToday = (data.todayVisitors || 0) + 1;

                        if (dbDate !== todayString) {
                            newToday = 1;
                        }

                        transaction.update(statsDocRef, {
                            totalVisitors: newTotal,
                            todayVisitors: newToday,
                            currentDate: todayString
                        });
                    }
                });
                
                localStorage.setItem('last_visit_date', todayString);
            } catch (e) {
                console.log("Visitor update skipped (Requires Auth or Public Write).");
            }
        }
    }

    // --- DASHBOARD INIT ---
    function initDashboardListeners() {
        if (dashboardInitialized) return;
        dashboardInitialized = true;
        
        // Start stats management (read/write)
        manageVisitorStats();

        // Fetch Users (Read Only)
        const usersRef = collection(db, "users");
        const q = query(usersRef, orderBy("joinDate", "desc"));

        onSnapshot(q, (snapshot) => {
            allUsersData = [];
            const mapMarkers = [];
            const today = new Date();
            let todayCount = 0;

            snapshot.forEach((doc) => {
                const data = doc.data();
                const name = data.displayName || (data.email ? data.email.split('@')[0] : 'User');
                
                let dateStr = 'Pending';
                let rawDate = new Date(0); 

                if (data.joinDate && data.joinDate.toDate) {
                    rawDate = data.joinDate.toDate();
                    dateStr = rawDate.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
                    
                    if (rawDate.getDate() === today.getDate() && 
                        rawDate.getMonth() === today.getMonth() && 
                        rawDate.getFullYear() === today.getFullYear()) {
                        todayCount++;
                    }
                }

                allUsersData.push({ name, dateStr, rawDate, geo: data.geo });

                if (data.geo && data.geo.lat && data.geo.lon) {
                    mapMarkers.push({
                        lat: data.geo.lat, lon: data.geo.lon, name, dateStr
                    });
                }
            });

            document.getElementById('total-users').textContent = snapshot.size;
            document.getElementById('joined-today').textContent = todayCount;

            renderUserTable(allUsersData);
            renderCalendar(null); 
            initializeUserMap(mapMarkers);

        }, (error) => {
            console.error("Error fetching users:", error);
            if(error.code === 'permission-denied') {
                document.getElementById('user-table-body').innerHTML = '<tr><td colspan="2">Public Access Required.<br>Check Firestore Rules.</td></tr>';
            }
        });
    }

    // --- AUTH & APP START ---
    const userStatusContainer = document.getElementById('user-status-container');

    const startApp = async () => {
        // Monitor Auth for Header UI only
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Logged In
                const userName = user.displayName || user.email.split('@')[0] || 'User';
                userStatusContainer.innerHTML = `<span class="welcome-user">Welcome, ${userName.split(' ')[0]}</span>
                  <a href="#" class="nav-link login-btn" id="logoutBtn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="icon">
              <path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h280v80H200v560h280v80H200Zm440-160-55-58 102-102H360v-80h327L585-622l55-58 200 200-200 200Z"/>
            </svg>
            Logout
          </a>`;
                const logoutBtn = document.getElementById('logoutBtn');
                if(logoutBtn) logoutBtn.addEventListener('click', () => signOut(auth).then(() => window.location.href = "index.html"));
            } else {
                // Not Logged In
                userStatusContainer.innerHTML = `<a href="login.html" class="nav-link login-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="icon">
              <path d="M234-276q51-39 114-61.5T480-360q69 0 132 22.5T726-276q35-41 54.5-93T800-480q0-133-93.5-226.5T480-800q-133 0-226.5 93.5T160-480q0 59 19.5 111t54.5 93Zm246-164q-59 0-99.5-40.5T340-580q0-59 40.5-99.5T480-720q59 0 99.5 40.5T620-580q0 59-40.5 99.5T480-440Zm0 360q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q53 0 100-15.5t86-44.5q-39-29-86-44.5T480-280q-53 0-100 15.5T294-220q39 29 86 44.5T480-160Zm0-360q26 0 43-17t17-43q0-26-17-43t-43-17q-26 0-43 17t-17 43q0 26 17 43t43 17Zm0-60Zm0 360Z"/>
            </svg>
            Login
          </a>`;
            }
            
            // ALWAYS Initialize Dashboard Data (Public Access Mode)
            // We do not wait for login, we just try to fetch.
            initDashboardListeners();
        });
    };
    
    startApp();

    // --- CLOCK & THEME ---
    const themeToggle = document.getElementById('themeToggle');
    if (themeToggle) {
        themeToggle.onclick = () => {
          document.body.classList.toggle('light');
          localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
          setTimeout(() => { if(userMapInstance) userMapInstance.invalidateSize(); }, 100);
        };
    }
    if (localStorage.getItem('theme') === 'light') document.body.classList.add('light');
    
    setInterval(() => {
      const now = new Date();
      const h = now.getHours() % 12 || 12;
      const m = now.getMinutes().toString().padStart(2,'0');
      const am = now.getHours() >= 12 ? 'PM' : 'AM';
      const el = document.getElementById('clock');
      if(el) el.textContent = `${h}:${m} ${am}`;
    }, 1000);
    
    const navToggle = document.querySelector('.nav-toggle');
    const nav = document.querySelector('nav');
    if (navToggle) navToggle.addEventListener('click', () => nav.classList.toggle('nav-active'));
  </script>

</body>
</html>
